<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>JNR Railway Trip Animation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { width: 100%; height: 600px; }
    .station-label span {
      font-size: 10px;
      color: black;
      background: white;
      padding: 2px 4px;
      border-radius: 3px;
      border: 1px solid #ccc;
    }
    #controls { margin: 10px 0; }
  </style>
</head>
<body>
  
<!--<h2>複数路線アニメーション</h2>-->

<div id="controls">
  <button data-route="route_1">①急行越前</button>
  <button data-route="route_2">②1226ㇾ</button>
  <button data-route="route_3">③521ㇾ</button>
  <button data-route="route_4">④急行妙高2号</button>
  <button data-route="route_5">⑤急行赤倉</button>
  <button data-route="route_6">⑥1342M</button>
  <button data-route="route_7">⑦急行妙高4号</button>
  <button data-route="route_8">⑧924M</button>
  <button data-route="route_9">⑨926M</button>

  <button id="start">開始</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
